version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nephro
      POSTGRES_PASSWORD: nephro
      POSTGRES_DB: nephrovision
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://nephro:nephro@db:5432/nephrovision
      SECRET_KEY: change-this-in-production-please-really
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://frontend"]'
    depends_on:
      - db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
